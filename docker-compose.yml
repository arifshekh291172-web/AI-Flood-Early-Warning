version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ne_shield_postgres
    restart: always
    environment:
      POSTGRES_DB: ne_shield
      POSTGRES_USER: ne_shield_admin
      POSTGRES_PASSWORD: secure_shield_pass
    ports:
      - "5432:5432"
    volumes:
      - ne_shield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ne_shield_admin -d ne_shield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ne_shield_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ne_shield_redisdata:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ne_shield_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ne_shield_admin:secure_shield_pass@postgres:5432/ne_shield
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      OPERATIONAL_MODE: LIVE
      JWT_SECRET: ne_shield_super_secure_jwt_secret_key_change_in_production_987654321
      IMD_API_BASE_URL: https://api.imd.gov.in/api/v1
      IMD_API_KEY: ${IMD_API_KEY:-}
      IMD_CLIENT_ID: ${IMD_CLIENT_ID:-}
      BHUVAN_WMS_URL: https://bhuvan-vec1.nrsc.gov.in/bhuvan/wms
      NDMA_CAP_FEED_URL: https://sachet.ndma.gov.in/cap_feed/rss
    ports:
      - "8000:8000"
    volumes:
      - ne_shield_uploads:/app/backend/app/static/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ne_shield_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  ne_shield_pgdata:
  ne_shield_redisdata:
  ne_shield_uploads:
